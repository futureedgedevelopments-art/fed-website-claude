# The site lives in fed-website-main/, so point Netlify there.
# Paths below (publish, functions) are relative to the base directory.
# Keep in sync with fed-website-main/netlify.toml.
[build]
base = "fed-website-main"
command = "npm run build:client"
functions = "netlify/functions"
publish = "dist/spa"

[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"

[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

# SPA fallback: serve index.html for client-side routes like /contact
# (not forced, so real files in dist/spa are still served first)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
