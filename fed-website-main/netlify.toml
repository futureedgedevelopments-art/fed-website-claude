# Netlify reads the repo-root netlify.toml (which sets base = "fed-website-main").
# Keep this file in sync with it for anyone deploying from this folder directly.

[build]
command = "npm run build:client"
functions = "netlify/functions"
publish = "dist/spa"


[functions]
external_node_modules = ["express"]
node_bundler = "esbuild"
[[redirects]]
force = true
from = "/api/*"
status = 200
to = "/.netlify/functions/api/:splat"

# Every real page is pre-rendered to its own index.html at build time
# (scripts/prerender.mjs), so anything that doesn't match a file is a
# genuine 404. Not forced, so real files are always served first.
[[redirects]]
from = "/*"
to = "/404.html"
status = 404
